<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Vault</title>
    <style>
        body { background: #111; color: white; font-family: system-ui, sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: auto; padding-top: 20px; }
        .card { background: #222; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input, textarea, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: none; box-sizing: border-box; font-family: inherit; }
        input, textarea { background: #333; color: white; }
        button { background: #f39c12; color: #111; font-weight: bold; cursor: pointer; margin-top: 20px; }
        button:hover { background: #e67e22; }
        table { width: 100%; text-align: left; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #444; }
        .delete-btn { background: #e74c3c; color: white; padding: 6px 12px; margin: 0; width: auto; font-size: 14px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Secure Header with Logout -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #222; padding: 15px 20px; border-radius: 12px;">
            <h1 style="color: #f39c12; margin: 0; font-size: 24px;">Admin Dashboard</h1>
            <form action="/admin/logout" method="POST" style="margin: 0;" onsubmit="sessionStorage.removeItem('vault_auth');">
                <button type="submit" style="background: #e74c3c; padding: 8px 16px; margin: 0; color: white; border-radius: 6px; width: auto;">Logout 🚪</button>
            </form>
        </div>

        <!-- Upload & Update Form -->
        <div class="card">
            <h2 id="formHeader">Upload New Project</h2>
            <form id="uploadForm">
                <input type="text" id="title" name="title" placeholder="Project Title" required>
                <input type="text" id="category" name="category" placeholder="Intro One-Liner (e.g., FINANCE & LOGS)" required>
                <textarea id="desc" name="desc" placeholder="Project Description..." rows="3" required></textarea>
                
                <label style="display:block; margin-top:15px; color:#aaa;">Upload Images (Multiple allowed):</label>
                <input type="file" id="images" name="images" accept="image/*" multiple required>

                <label style="display:block; margin-top:15px; color:#aaa;">Upload ZIP File:</label>
                <input type="file" id="zipfile" name="zipfile" accept=".zip" required>
                
                <button type="submit" id="submitBtn">Deploy to Cloud</button>
            </form>
            <p id="statusMsg" style="font-weight:bold; margin-top:15px;"></p>
        </div>

        <!-- Live Database -->
        <div class="card">
            <h2>Live Database</h2>
            <table>
                <thead>
                    <tr>
                        <th>Title & Category</th>
                        <th>Files Attached</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="projectList">
                    <tr><td colspan="3">Loading data from Supabase...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Ghost Session Killer
        if (!sessionStorage.getItem("vault_auth")) {
            fetch('/admin/logout', {method: 'POST'}).then(() => window.location.href = "/admin");
        }

        let editModeId = null;

        // Form Submit Logic (Handles both POST and PUT)
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const statusMsg = document.getElementById('statusMsg');
            
            statusMsg.textContent = editModeId ? "Updating Cloud Storage..." : "Uploading to Cloud Storage...";
            statusMsg.style.color = "#f39c12";

            const formData = new FormData(form);
            const method = editModeId ? 'PUT' : 'POST';
            if (editModeId) formData.append('id', editModeId);

            try {
                const res = await fetch('/api/admin/projects', { method: method, body: formData });
                if(res.ok) {
                    statusMsg.textContent = editModeId ? "Successfully updated!" : "Successfully deployed!";
                    statusMsg.style.color = "#2ecc71";
                    
                    // Reset Form
                    form.reset();
                    editModeId = null;
                    document.getElementById('formHeader').textContent = "Upload New Project";
                    document.getElementById('submitBtn').textContent = "Deploy to Cloud";
                    document.getElementById('images').required = true;
                    document.getElementById('zipfile').required = true;
                    
                    fetchProjects();
                    setTimeout(() => { statusMsg.textContent = ""; }, 3000);
                } else {
                    throw new Error("Upload Failed");
                }
            } catch (err) {
                statusMsg.textContent = "Error communicating with cloud.";
                statusMsg.style.color = "#e74c3c";
            }
        });

        // Safe Database Rendering
        async function fetchProjects() {
            const tbody = document.getElementById('projectList');
            try {
                const res = await fetch('/api/admin/projects');
                const data = await res.json();
                
                tbody.innerHTML = "";
                if (data.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='3'>No projects found in vault.</td></tr>";
                    return;
                }

                data.forEach(proj => {
                    const tr = document.createElement('tr');
                    
                    // Info Column
                    const tdInfo = document.createElement('td');
                    tdInfo.innerHTML = `<strong>${proj.title || 'Untitled'}</strong><br><small style="color:#f39c12;">${proj.category || "NEW UPLOAD"}</small>`;
                    
                    // Files Column
                    const tdFiles = document.createElement('td');
                    tdFiles.innerHTML = `<span style="color:#aaa; font-size:12px;">ZIP: ${proj.filename || 'None'}<br>IMG: Attached</span>`;
                    
                    // Action Column
                    const tdAction = document.createElement('td');
                    
                    const editBtn = document.createElement('button');
                    editBtn.textContent = 'Edit';
                    editBtn.style = "background:#3498db; color:white; padding:6px 12px; margin-right:5px; border-radius:4px; border:none; cursor:pointer;";
                    editBtn.onclick = () => {
                        editModeId = proj.id;
                        document.getElementById('title').value = proj.title || "";
                        document.getElementById('category').value = proj.category || "";
                        document.getElementById('desc').value = proj.description || "";
                        document.getElementById('images').required = false;
                        document.getElementById('zipfile').required = false;
                        document.getElementById('formHeader').textContent = "Update Existing Project";
                        document.getElementById('submitBtn').textContent = "Save Changes";
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    };
                    
                    const delBtn = document.createElement('button');
                    delBtn.textContent = 'Delete';
                    delBtn.className = 'delete-btn';
                    delBtn.onclick = () => deleteProject(proj.id);
                    
                    tdAction.appendChild(editBtn);
                    tdAction.appendChild(delBtn);
                    tr.appendChild(tdInfo);
                    tr.appendChild(tdFiles);
                    tr.appendChild(tdAction);
                    
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = "<tr><td colspan='3' style='color:#e74c3c;'>Error loading database.</td></tr>";
            }
        }

        async function deleteProject(id) {
            if(!confirm("Are you sure you want to permanently delete this project?")) return;
            await fetch('/api/admin/projects', {
                method: 'DELETE',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ids: [id]})
            });
            fetchProjects(); 
        }

        fetchProjects();
    </script>
</body>
</html>
